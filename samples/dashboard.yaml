- title: Fans & Plant
  path: plant-equipment-card
  icon: mdi:fan
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: "### Circulation Pump Set\n`faceplate: circulation-pump-set`  \nEmulates Hot\
        \ or chilled water circulation pump set."
    - type: custom:plant-equipment-card
      faceplate: circulation-pump-set
      title: Circulation Pump Set
      entities:
        common_fault: sensor.pumpset_common_fault
        pump1_current: sensor.pumpset_pump1_current
        pump1_run: sensor.pumpset_pump1_run
        pump2_current: sensor.pumpset_pump2_current
        pump2_run: sensor.pumpset_pump2_run
      options:
        pumps: 2
        service: 0
    - type: markdown
      content: "### Exhaust Fan\n`faceplate: exhaust-fan`  \nEmulates Axial exhaust fan."
    - type: custom:plant-equipment-card
      faceplate: exhaust-fan
      title: Exhaust Fan
      entities: *id002
    - type: markdown
      content: "### Hot Water Unit\n`faceplate: hot-water-unit`  \nEmulates Calorifier / plate\
        \ hot water unit."
    - type: custom:plant-equipment-card
      faceplate: hot-water-unit
      title: Hot Water Unit
      entities: *id002
      options:
        units: 1
    - type: markdown
      content: "### Supply Fan \u2014 in from left\n`faceplate: supply-fan-left`  \nEmulates\
        \ Centrifugal supply fan."
    - type: custom:plant-equipment-card
      faceplate: supply-fan-left
      title: "Supply Fan \u2014 in from left"
      entities: *id002
    - type: markdown
      content: "### Supply Fan \u2014 in from right\n`faceplate: supply-fan-right`  \nEmulates\
        \ Centrifugal supply fan."
    - type: custom:plant-equipment-card
      faceplate: supply-fan-right
      title: "Supply Fan \u2014 in from right"
      entities: *id002
    - type: markdown
      content: "### Supply Fan \u2014 in from top\n`faceplate: supply-fan-top`  \nEmulates\
        \ Centrifugal supply fan."
    - type: custom:plant-equipment-card
      faceplate: supply-fan-top
      title: "Supply Fan \u2014 in from top"
      entities: *id002
- title: Plant
  path: pump-system-card
  icon: mdi:pump
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: '### Vertical multistage pump set

        `faceplate: vertical-pumpset`'
    - type: custom:pump-system-card
      faceplate: vertical-pumpset
      title: Vertical multistage pump set
      entities:
        common_fault: sensor.pumpset_common_fault
        pressure_setpoint: sensor.pumpset_pressure_setpoint
        pump1_current: sensor.pumpset_pump1_current
        pump1_run: sensor.pumpset_pump1_run
        pump1_speed: sensor.pumpset_pump1_speed
        pump2_current: sensor.pumpset_pump2_current
        pump2_run: sensor.pumpset_pump2_run
        pump2_speed: sensor.pumpset_pump2_speed
        pump3_current: sensor.pumpset_pump3_current
        pump3_run: sensor.pumpset_pump3_run
        pump3_speed: sensor.pumpset_pump3_speed
        system_pressure: sensor.pumpset_system_pressure
      options:
        pumps: 3

views:
- title: About
  path: about
  icon: mdi:information-outline
  cards:
  - type: markdown
    content: '# Card samples


      Every faceplate in the catalogue, drawn against real data from this site. The same device
      is used across a card''s samples so the **drawings** can be compared rather than the
      readings.


      - Meters bound to **DB-1**

      - Controllers bound to **Room 1**


      Each caption gives the `faceplate:` id to copy. Source and documentation: `rellis-erigon/HA-Cards`.


      Product names and marks belong to their respective owners; these cards are independent
      and unaffiliated.'
- title: Audio
  path: audio-zone-card
  icon: mdi:speaker
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: "### Q-SYS Zone Rack\n`faceplate: qsys-zone-rack`  \nEmulates Q-SYS zone outputs."
    - type: custom:audio-zone-card
      faceplate: qsys-zone-rack
      title: Q-SYS Zone Rack
      entities:
        zone1_mute: switch.zone1_mute
        zone1_volume: number.zone1_volume
        zone2_mute: switch.zone2_mute
        zone2_volume: number.zone2_volume
        zone3_mute: switch.zone3_mute
        zone3_volume: number.zone3_volume
        zone4_mute: switch.zone4_mute
        zone4_volume: number.zone4_volume
      options:
        zones: 4
    - type: markdown
      content: "### Zone Mixer\n`faceplate: zone-mixer`  \nEmulates DSP zone mixer strip."
    - type: custom:audio-zone-card
      faceplate: zone-mixer
      title: Zone Mixer
      entities:
        zone1_mute: switch.zone1_mute
        zone1_volume: number.zone1_volume
        zone2_mute: switch.zone2_mute
        zone2_volume: number.zone2_volume
      options:
        zones: 2
        eq: 0
- title: Meters
  path: bms-meter-card
  icon: mdi:gauge
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: "### Circutor CVM-E3-MINI\n`faceplate: circutor-cvm-e3-mini`  \nEmulates Circutor\
        \ CVM-E3-MINI-WiEth.  \nPages: power, volts, amps, energy."
    - type: custom:bms-meter-card
      faceplate: circutor-cvm-e3-mini
      title: Circutor CVM-E3-MINI
      entities: &id001
        energy_total: sensor.db_1_energy_total
        power_total: sensor.db_1_power_total
        power_l1: sensor.db_1_power_l1
        power_l2: sensor.db_1_power_l2
        power_l3: sensor.db_1_power_l3
        volts_l1: sensor.db_1_volts_l1
        volts_l2: sensor.db_1_volts_l2
        volts_l3: sensor.db_1_volts_l3
        power_factor: sensor.db_1_power_factor
    - type: markdown
      content: "### Compound Water Meter\n`faceplate: compound-meter`  \nEmulates Compound\
        \ water meter with main and bypass registers."
    - type: custom:bms-meter-card
      faceplate: compound-meter
      title: Compound Water Meter
      entities:
        volume_total: sensor.water_1_volume_total
    - type: markdown
      content: "### DIN-rail 3-phase analyser\n`faceplate: din-3phase-analyser`  \nPages:\
        \ volts, amps, power."
    - type: custom:bms-meter-card
      faceplate: din-3phase-analyser
      title: DIN-rail 3-phase analyser
      entities: *id001
    - type: markdown
      content: "### Dial Water Meter\n`faceplate: dial-water-meter`  \nEmulates Single-jet\
        \ dial-face water meter."
    - type: custom:bms-meter-card
      faceplate: dial-water-meter
      title: Dial Water Meter
      entities:
        volume_total: sensor.water_1_volume_total
    - type: markdown
      content: '### Generic 3-phase meter

        `faceplate: generic-3phase`'
    - type: custom:bms-meter-card
      faceplate: generic-3phase
      title: Generic 3-phase meter
      entities: *id001
    - type: markdown
      content: "### LCD Water Meter\n`faceplate: lcd-water-meter`  \nEmulates Battery-powered\
        \ electronic water meter."
    - type: custom:bms-meter-card
      faceplate: lcd-water-meter
      title: LCD Water Meter
      entities:
        volume_total: sensor.water_1_volume_total
    - type: markdown
      content: "### Multi-jet water register\n`faceplate: multijet-water-register`  \nEmulates\
        \ Multi-jet mechanical water meter register."
    - type: custom:bms-meter-card
      faceplate: multijet-water-register
      title: Multi-jet water register
      entities:
        volume_total: sensor.water_1_volume_total
    - type: markdown
      content: "### Schneider EasyLogic PM2200\n`faceplate: schneider-pm2200`  \nEmulates\
        \ Schneider Electric EasyLogic PM2200.  \nPages: summary, amps, volts, power."
    - type: custom:bms-meter-card
      faceplate: schneider-pm2200
      title: Schneider EasyLogic PM2200
      entities: *id001
    - type: markdown
      content: "### Smart Water Meter\n`faceplate: smart-water-meter`  \nEmulates Smart water\
        \ meter with leak and reverse-flow detection."
    - type: custom:bms-meter-card
      faceplate: smart-water-meter
      title: Smart Water Meter
      entities:
        volume_total: sensor.water_1_volume_total
    - type: markdown
      content: "### Woltmann Bulk Register\n`faceplate: woltmann-register`  \nEmulates Woltmann-type\
        \ bulk water meter register."
    - type: custom:bms-meter-card
      faceplate: woltmann-register
      title: Woltmann Bulk Register
      entities:
        volume_total: sensor.water_1_volume_total
- title: Fire
  path: fire-panel-card
  icon: mdi:fire-alert
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: "### Fire Indicator Panel (schematic)\n`faceplate: generic-fip`  \nEmulates\
        \ Generic fire indicator panel (not a specific make)."
    - type: custom:fire-panel-card
      faceplate: generic-fip
      title: Fire Indicator Panel (schematic)
      entities: &id002
        room_temp: sensor.ac_1_room_temp
        setpoint: sensor.ac_1_setpoint
        hvac_mode: sensor.ac_1_hvac_mode
      options:
        zones: 8

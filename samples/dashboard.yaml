- title: Fans & Plant
  path: plant-equipment-card
  icon: mdi:fan
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: "### Circulation Pump Set\n`faceplate: circulation-pump-set`  \nEmulates Hot\
        \ or chilled water circulation pump set."
    - type: custom:plant-equipment-card
      faceplate: circulation-pump-set
      title: Circulation Pump Set
      entities:
        common_fault: sensor.common_fault
        pump1_current: sensor.pump1_current
        pump1_run: sensor.pump1_run
        pump2_current: sensor.pump2_current
        pump2_run: sensor.pump2_run
      options:
        pumps: 2
        service: 0
    - type: markdown
      content: "### Exhaust Fan\n`faceplate: exhaust-fan`  \nEmulates Axial exhaust fan."
    - type: custom:plant-equipment-card
      faceplate: exhaust-fan
      title: Exhaust Fan
      entities: {}
    - type: markdown
      content: "### Hot Water Unit\n`faceplate: hot-water-unit`  \nEmulates Calorifier / plate\
        \ hot water unit."
    - type: custom:plant-equipment-card
      faceplate: hot-water-unit
      title: Hot Water Unit
      entities:
        common_fault: sensor.common_fault
      options:
        units: 1
    - type: markdown
      content: "### Supply Fan \u2014 in from left\n`faceplate: supply-fan-left`  \nEmulates\
        \ Centrifugal supply fan."
    - type: custom:plant-equipment-card
      faceplate: supply-fan-left
      title: "Supply Fan \u2014 in from left"

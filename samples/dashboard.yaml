# Card samples — reference dashboard.
#
# Entity ids here are documentation examples. Replace them with your own,
# or drop the entities block entirely: roles are matched from entity ids
# where the naming is recognisable.
#
# Generated from the live samples dashboard, with site detail removed.

views:
- title: About
  path: about
  icon: mdi:information-outline
  cards:
  - type: markdown
    content: '# Card samples


      Every faceplate in the catalogue, drawn against real data from this site. The same device
      is used across a card''s samples so the **drawings** can be compared rather than the
      readings.


      - Meters bound to **DB-1**

      - Controllers bound to **Room 1**


      Each caption gives the `faceplate:` id to copy. Source and documentation: `rellis-erigon/HA-Cards`.


      Product names and marks belong to their respective owners; these cards are independent
      and unaffiliated.'
- title: Meters
  path: bms-meter-card
  icon: mdi:gauge
  cards:

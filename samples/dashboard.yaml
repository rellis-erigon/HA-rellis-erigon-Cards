views:
- title: About
  path: about
  icon: mdi:information-outline
  cards:
  - type: markdown
    content: "## Card samples\n\nEvery faceplate in the catalogue, bound to live points where\
      \ this site has them. Generated by `scripts/build-samples.py` \u2014 edits here are\
      \ overwritten.\n\nBrand names identify the hardware a faceplate emulates. Those marks\
      \ belong to their respective owners; these cards are independent and unaffiliated."
- title: Audio
  path: audio-zone-card
  icon: mdi:speaker
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: "### Q-SYS Zone Rack\n`faceplate: qsys-zone-rack`  \nEmulates Q-SYS zone outputs."
    - type: custom:audio-zone-card
      faceplate: qsys-zone-rack
      title: Q-SYS Zone Rack
      entities:
        zone1_mute: switch.zone1_mute
        zone1_volume: sensor.zone1_volume
        zone2_mute: switch.zone2_mute
        zone2_volume: sensor.zone2_volume
        zone3_mute: switch.zone3_mute
        zone3_volume: sensor.zone3_volume
        zone4_mute: switch.zone4_mute
        zone4_volume: sensor.zone4_volume
      options:
        zones: 4
    - type: markdown
      content: "### Zone Mixer (console)\n`faceplate: zone-mixer`  \nEmulates Audio mixing\
        \ console channel strip."
    - type: custom:audio-zone-card
      faceplate: zone-mixer
      title: Zone Mixer (console)
      entities:
        zone1_mute: switch.zone1_mute
        zone1_volume: sensor.zone1_volume
        zone2_mute: switch.zone2_mute
        zone2_volume: sensor.zone2_volume
        zone3_mute: switch.zone3_mute
        zone3_volume: sensor.zone3_volume
        zone4_mute: switch.zone4_mute
        zone4_volume: sensor.zone4_volume
      options:
        zones: 4
        eq: 0
- title: Meters
  path: bms-meter-card
  icon: mdi:gauge
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: "### Circutor CVM-E3-MINI\n`faceplate: circutor-cvm-e3-mini`  \nEmulates Circutor\
        \ CVM-E3-MINI-WiEth."
    - type: custom:bms-meter-card
      faceplate: circutor-cvm-e3-mini
      title: Circutor CVM-E3-MINI
      entities:
        current_l1: sensor.current_l1
        current_l2: sensor.current_l2
        current_l3: sensor.current_l3
        energy_total: sensor.energy_total
        power_factor: sensor.power_factor
        power_total: sensor.power_total
        volts_l1: sensor.volts_l1
        volts_l2: sensor.volts_l2
        volts_l3: sensor.volts_l3
    - type: markdown
      content: "### Compound Water Meter\n`faceplate: compound-meter`  \nEmulates Compound\
        \ water meter with main and bypass registers."
    - type: custom:bms-meter-card
      faceplate: compound-meter
      title: Compound Water Meter
      entities:
        volume_total: sensor.volume_total
    - type: markdown
      content: '### DIN-rail 3-phase analyser

        `faceplate: din-3phase-analyser`'

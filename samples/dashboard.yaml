- title: Plant
  path: pump-system-card
  icon: mdi:pump
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: markdown
      content: '### Vertical multistage pump set

        `faceplate: vertical-pumpset`'
    - type: custom:pump-system-card
      faceplate: vertical-pumpset
      title: Vertical multistage pump set
      entities:
        common_fault: sensor.common_fault
        pressure_setpoint: sensor.pressure_setpoint
        pump1_current: sensor.pump1_current
        pump1_run: sensor.pump1_run
        pump1_speed: sensor.pump1_speed
        pump2_current: sensor.pump2_current
        pump2_run: sensor.pump2_run
        pump2_speed: sensor.pump2_speed
        pump3_current: sensor.pump3_current
        pump3_run: sensor.pump3_run
        pump3_speed: sensor.pump3_speed
        system_pressure: sensor.system_pressure
      options:
        pumps: 3
